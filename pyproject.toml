[project]
name = "kimi-vendor-verifier"
version = "0.1.0"
description = "Kimi Vendor Verifier"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "inspect-ai>=0.3.158",
    "inspect-evals>=0.3.103",
    "jsonschema>=4.25.1",
    "loguru>=0.7.3",
    "math-verify>=0.8.0",
    "openai>=2.14.0",
    "pillow>=12.1.0",
    "pytest>=8.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.5",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "kvv_selftest"]
markers = [
    "smoke_test: quick smoke tests",
    "flaky: tests that may be retried on failure",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed (e.g. as a git dependency of another project), the whole KVV tree -- scripts,
# tests/, testdata/, beam/, toolcall_benchmark/ -- lands inside the kimi_vendor_verifier
# package with its layout unchanged, so the suites run from there exactly as they do from
# a checkout: `pytest <ROOT>/tests/...`, `python <ROOT>/eval.py ...`.
# kimi_vendor_verifier.ROOT is that directory (the checkout root in an editable install).
[tool.hatch.build.targets.wheel]
packages = ["kimi_vendor_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"aime2025.py" = "kimi_vendor_verifier/aime2025.py"
"eval.py" = "kimi_vendor_verifier/eval.py"
"kimi_model.py" = "kimi_vendor_verifier/kimi_model.py"
"kimi_toolcall.py" = "kimi_vendor_verifier/kimi_toolcall.py"
"mmmu_pro_vision.py" = "kimi_vendor_verifier/mmmu_pro_vision.py"
"ocr_bench.py" = "kimi_vendor_verifier/ocr_bench.py"
"utils.py" = "kimi_vendor_verifier/utils.py"
"verify_params.py" = "kimi_vendor_verifier/verify_params.py"
"tests" = "kimi_vendor_verifier/tests"
"testdata" = "kimi_vendor_verifier/testdata"
"beam" = "kimi_vendor_verifier/beam"
"toolcall_benchmark" = "kimi_vendor_verifier/toolcall_benchmark"

[project.entry-points.inspect_ai]
kimi_vendor_verifier = "kimi_vendor_verifier._inspect_registry"
